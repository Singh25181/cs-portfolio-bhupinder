<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Clock</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d1a26;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        /* Header Styling */
        h1 {
            font-size: 2em;
            color: #1abc9c;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(26, 188, 156, 0.5);
        }

        /* Clock Display Container */
        #clock {
            font-family: 'Digital-7', monospace;
            font-size: 5em; 
            padding: 20px 40px;
            border: 5px solid #16a085; 
            border-radius: 10px;
            background-color: #2c3e50;
            color: #1abc9c; 
            box-shadow: 
                0 0 20px rgba(26, 188, 156, 0.5), 
                inset 0 0 10px rgba(0, 0, 0, 0.5); 
            letter-spacing: 5px;
            text-shadow: 0 0 8px #1abc9c; 
        }

        @media (max-width: 600px) {
            #clock {
                font-size: 3em;
                padding: 15px 25px;
            }
        }
        
        @font-face {
            font-family: 'Digital-7';
            src: local('Courier New'), local('monospace');
        }

    </style>
    </head>
<body>
    <h1>Digital Clock</h1>
    <div id="clock"></div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString(); 
        }
        setInterval(updateClock, 1000); 
        updateClock(); 
    </script>
</body>
</html>
