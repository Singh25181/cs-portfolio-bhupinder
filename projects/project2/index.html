<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background-color: #e9ecef;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      /* Calculator Container */
      .calculator-container {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        max-width: 350px;
        width: 100%;
        text-align: center;
      }

      h1 {
        color: #0077b6;
        margin-bottom: 25px;
        font-size: 1.8em;
      }

      /* Input Fields */
      input[type="number"] {
        width: calc(100% - 10px);
        padding: 10px;
        margin: 5px 0 15px 0;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 1em;
        text-align: center;
      }

      /* Button Layout */
      .buttons-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 25px;
      }

      /* Buttons */
      button {
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-size: 1em;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
      }

      button:nth-child(1) {
        /* Add */
        background-color: #28a745;
        color: white;
      }
      button:nth-child(2) {
        background-color: #ffc107;
        color: #333;
      }
      button:nth-child(3) {
        background-color: #17a2b8;
        color: white;
      }
      button:nth-child(4) {
        background-color: #dc3545;
        color: white;
      }

      button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      #result {
        font-size: 1.5em;
        font-weight: bold;
        color: #343a40;
        padding: 10px;
        border-top: 2px solid #ced4da;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="calculator-container">
      <h1>Simple Calculator</h1>
      <input type="number" id="num1" placeholder="Number 1" />
      <input type="number" id="num2" placeholder="Number 2" />
      <div class="buttons-grid">
        <button onclick="add()">Add</button>
        <button onclick="subtract()">Subtract</button>
        <button onclick="divide()">Divide</button>
        <button onclick="multiplication()">Multiply</button>
      </div>
      <p id="result">Result:</p>
    </div>

    <script>
      function getNumbers() {
        const a = parseFloat(document.getElementById("num1").value) || 0;
        const b = parseFloat(document.getElementById("num2").value) || 0;
        return { a, b };
      }

      function displayResult(value) {
        document.getElementById("result").innerText =
          "Result: " + (isNaN(value) ? "Error" : value);
      }

      function add() {
        const { a, b } = getNumbers();
        displayResult(a + b);
      }

      function subtract() {
        const { a, b } = getNumbers();
        displayResult(a - b);
      }

      function divide() {
        const { a, b } = getNumbers();
        if (b === 0) {
          document.getElementById("result").innerText =
            "Result: Cannot divide by zero!";
        } else {
          displayResult(a / b);
        }
      }

      function multiplication() {
        const { a, b } = getNumbers();
        displayResult(a * b);
      }

      document.querySelector(".buttons-grid button:nth-child(4)").innerText =
        "Multiply";
    </script>
  </body>
</html>
