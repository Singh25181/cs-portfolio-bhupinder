<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Greeting Page</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f8ff;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }

      .container {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        max-width: 90%;
        width: 500px;
        border-top: 5px solid #0077b6;
      }

      h1 {
        color: #0077b6;
        font-size: 2.5em;
        margin-bottom: 15px;
        letter-spacing: 1px;
      }

      p {
        font-size: 1.1em;
        color: #555;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello, Welcome to My Portfolio!</h1>
      <p>
        This project shows how a simple HTML page can display a greeting
        message.
      </p>
    </div>
  </body>
</html>
